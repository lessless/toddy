name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests + formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0"

      - name: Install libtdjson (needed to compile the NIF, even for unit tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf zlib1g-dev libssl-dev
          # Pinned per Constitution Principle IV / research.md R3 — verified working
          # through authorizationStateWaitCode against live Telegram infrastructure.
          # Distro/package-manager "stable" builds can be old enough that Telegram
          # rejects login (UPDATE_APP_TO_LOGIN); unpinned HEAD builds can silently
          # change setTdlibParameters's wire format out from under us (see R3's
          # second addendum) — so this intentionally builds from source at an exact
          # commit rather than an apt/homebrew package or a moving branch tip.
          git clone https://github.com/tdlib/td.git /tmp/td
          git -C /tmp/td checkout 022d60202e446ad1287b9fb68e687c8a0760788b
          cmake -S /tmp/td -B /tmp/td/build -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_LTO=OFF
          cmake --build /tmp/td/build --target tdjson -- -j"$(nproc)"
          sudo cmake --install /tmp/td/build
          sudo ldconfig

      - name: Install Zig toolchain
        uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"

      - name: Restore deps/build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  integration:
    name: Integration tests (real libtdjson)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0"

      - name: Install libtdjson
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf zlib1g-dev libssl-dev
          # Pinned per Constitution Principle IV / research.md R3 — verified working
          # through authorizationStateWaitCode against live Telegram infrastructure.
          # Distro/package-manager "stable" builds can be old enough that Telegram
          # rejects login (UPDATE_APP_TO_LOGIN); unpinned HEAD builds can silently
          # change setTdlibParameters's wire format out from under us (see R3's
          # second addendum) — so this intentionally builds from source at an exact
          # commit rather than an apt/homebrew package or a moving branch tip.
          git clone https://github.com/tdlib/td.git /tmp/td
          git -C /tmp/td checkout 022d60202e446ad1287b9fb68e687c8a0760788b
          cmake -S /tmp/td -B /tmp/td/build -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_LTO=OFF
          cmake --build /tmp/td/build --target tdjson -- -j"$(nproc)"
          sudo cmake --install /tmp/td/build
          sudo ldconfig

      - name: Install Zig toolchain
        uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"

      - run: mix deps.get

      # Only the non-credentialed portion of the integration suite runs in
      # CI (Constitution Principle III) — the tests gated on TG_API_ID /
      # TG_API_HASH / TG_TEST_PHONE / TG_TEST_CODE / TG_TEST_GROUP need a
      # live Telegram login and are skipped here by design (see README).
      - run: mix test --include integration
